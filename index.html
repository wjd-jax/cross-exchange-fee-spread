<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>跨所资金费率分析</title>
    <style>
      :root {
        --bg: #f6f3ec;
        --panel: #fffdf8;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5ddd0;
        --accent: #136f63;
        --accent-soft: #e0f2ef;
        --good: #0f9f63;
        --bad: #d14343;
        --warn: #b7791f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #faf8f4 0%, #f3eee6 100%);
      }

      .page {
        max-width: 1720px;
        margin: 0 auto;
        padding: 20px 20px 40px;
      }

      .workspace {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .sidebar {
        position: sticky;
        top: 20px;
        align-self: start;
        min-width: 0;
      }

      .panel {
        background: rgba(255, 253, 248, 0.98);
        border: 1px solid rgba(225, 216, 201, 0.95);
        border-radius: 20px;
        box-shadow: 0 10px 28px rgba(80, 63, 37, 0.06);
      }

      .panel {
        padding: 18px;
      }

      .entry-panel {
        margin-bottom: 0;
      }

      .entry-panel .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }

      .field input,
      .field select {
        width: 100%;
        height: 46px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fffdfa;
        color: var(--ink);
        font-size: 14px;
      }

      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: rgba(19, 111, 99, 0.5);
        box-shadow: 0 0 0 3px rgba(19, 111, 99, 0.08);
      }

      .entry-head {
        display: grid;
        gap: 4px;
        margin-bottom: 14px;
      }

      .entry-head strong {
        font-size: 18px;
        line-height: 1.2;
      }

      .entry-head span {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .exchange-grid {
        display: grid;
        gap: 10px;
      }

      .side-config {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 8px;
      }

      .swap-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .swap-button {
        width: 42px;
        min-width: 42px;
        height: 42px;
        min-height: 42px;
        padding: 0;
        border-radius: 12px;
        border: 1px solid rgba(19, 111, 99, 0.16);
        background: #eef7f5;
        color: var(--accent);
        box-shadow: none;
        font-size: 18px;
        font-weight: 700;
      }

      .swap-button:hover:not(:disabled) {
        transform: none;
        box-shadow: none;
        background: #e4f3ef;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #0f766e 0%, #136f63 100%);
        color: white;
        min-height: 48px;
        padding: 0 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(19, 111, 99, 0.18);
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(19, 111, 99, 0.22);
      }

      button:disabled {
        cursor: progress;
        opacity: 0.75;
      }

      .alert {
        margin: 18px 0 0;
        padding: 14px 16px;
        border-radius: 16px;
        font-size: 14px;
      }

      .alert.error {
        background: #fff1f1;
        color: #8a2727;
        border: 1px solid #f0c6c6;
      }

      .alert.warn {
        background: #fff8ea;
        color: #8a5a12;
        border: 1px solid #f1dfb3;
      }

      .alert.good {
        background: #edf9f2;
        color: #16613f;
        border: 1px solid #b7e3c8;
      }

      .alert.info {
        background: #eef6ff;
        color: #1f4b7a;
        border: 1px solid #cfe0f5;
      }

      .results {
        display: none;
        min-width: 0;
        gap: 14px;
        align-content: start;
      }

      .results.visible {
        display: grid;
      }

      .results .panel {
        padding: 16px 18px;
        border-radius: 20px;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.18fr) minmax(360px, 0.82fr);
        gap: 14px;
        align-items: stretch;
      }

      .summary-panel {
        min-width: 0;
      }

      .snapshot-panel {
        min-width: 0;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        padding: 12px 14px;
        border-radius: 14px;
        background: #faf6ef;
        border: 1px solid var(--line);
      }

      .stat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .stat small {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat strong {
        font-size: 22px;
        line-height: 1.1;
      }

      .summary-line {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #f8f4ec;
        border: 1px dashed var(--line);
        height: 100%;
      }

      .summary-line-copy {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .summary-line-copy small {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .summary-line-copy span {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .summary-line strong {
        font-size: 25px;
        line-height: 1.05;
        letter-spacing: 0;
        white-space: normal;
        text-align: left;
      }

      .summary-aux {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        gap: 10px;
        margin-top: 10px;
        align-items: stretch;
      }

      .tables-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.84fr) minmax(0, 1.16fr);
        gap: 14px;
      }

      #recommendation-box .alert,
      #warning-box .alert {
        margin: 0;
      }

      #recommendation-box .alert {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 8px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        border: 1px solid transparent;
      }

      .tag.positive {
        background: rgba(15, 159, 99, 0.12);
        border-color: rgba(15, 159, 99, 0.2);
      }

      .tag.negative {
        background: rgba(209, 67, 67, 0.12);
        border-color: rgba(209, 67, 67, 0.2);
      }

      .tag.neutral {
        background: rgba(183, 121, 31, 0.12);
        border-color: rgba(183, 121, 31, 0.2);
      }

      .positive {
        color: var(--good);
      }

      .negative {
        color: var(--bad);
      }

      .neutral {
        color: var(--warn);
      }

      .muted {
        color: var(--muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        text-align: right;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .table-metric-stack {
        display: grid;
        gap: 2px;
        justify-items: end;
      }

      .table-metric-stack small {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.3;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 16px;
      }

      .section-head span {
        color: var(--muted);
        font-size: 11px;
      }

      .alert {
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.5;
      }

      .snapshot-metric-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 2px;
      }

      .snapshot-metric-row {
        display: grid;
        gap: 4px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #faf6ef;
        border: 1px solid rgba(229, 221, 208, 0.9);
      }

      .snapshot-metric-row:last-child {
        padding-bottom: 10px;
      }

      .snapshot-metric-row small {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      .snapshot-metric-row strong {
        font-size: 19px;
        line-height: 1.1;
        text-align: left;
      }

      .snapshot-side-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .snapshot-side-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-radius: 14px;
        background: #fffdfa;
        border: 1px solid var(--line);
      }

      .snapshot-side-card.long {
        border-color: rgba(15, 159, 99, 0.18);
        background: linear-gradient(180deg, rgba(237, 249, 242, 0.55) 0%, #fffdfa 100%);
      }

      .snapshot-side-card.short {
        border-color: rgba(209, 67, 67, 0.16);
        background: linear-gradient(180deg, rgba(255, 241, 241, 0.52) 0%, #fffdfa 100%);
      }

      .snapshot-side-head {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }

      .snapshot-side-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 38px;
        height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .snapshot-side-badge.long {
        background: rgba(15, 159, 99, 0.1);
        color: var(--good);
        border-color: rgba(15, 159, 99, 0.18);
      }

      .snapshot-side-badge.short {
        background: rgba(209, 67, 67, 0.1);
        color: var(--bad);
        border-color: rgba(209, 67, 67, 0.16);
      }

      .snapshot-side-labels {
        min-width: 0;
      }

      .snapshot-side-title {
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
      }

      .snapshot-side-meta {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.4;
        margin-top: 2px;
      }

      .snapshot-side-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px 10px;
      }

      .snapshot-side-item {
        min-width: 0;
        display: grid;
        gap: 3px;
      }

      .snapshot-side-item.full {
        grid-column: 1 / -1;
      }

      .snapshot-side-item small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.3;
        margin-bottom: 2px;
      }

      .snapshot-side-item strong {
        display: block;
        font-size: 12px;
        line-height: 1.25;
      }

      @media (max-width: 1480px) {
        .overview-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 1320px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .entry-panel .form-grid,
        .tables-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 960px) {
        .summary-grid {
          grid-template-columns: 1fr;
        }

        .summary-aux {
          grid-template-columns: 1fr;
        }

        .snapshot-metric-list {
          grid-template-columns: 1fr;
        }

        .snapshot-side-grid {
          grid-template-columns: 1fr 1fr;
        }

        .summary-line {
          gap: 8px;
        }
      }

      @media (max-width: 560px) {
        .form-grid,
        .exchange-grid,
        .snapshot-side-grid {
          grid-template-columns: 1fr;
        }

        .swap-wrap {
          justify-content: flex-start;
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="workspace">
        <aside class="sidebar">
        <section class="panel entry-panel">
          <div class="entry-head">
            <strong>查询条件</strong>
            <span>选择币种、做多 / 做空交易所和回看天数</span>
          </div>
          <form id="analysis-form">
            <div class="form-grid">
              <div class="field full">
                <label for="symbol">币种</label>
                <input id="symbol" name="symbol" placeholder="例如 KAT">
              </div>
              <div class="exchange-grid field full">
                <div class="field">
                  <label for="long_exchange">做多交易所</label>
                  <div class="side-config">
                    <select id="long_exchange" name="long_exchange"></select>
                    <select id="long_market_type" name="long_market_type" aria-label="做多市场类型"></select>
                  </div>
                </div>
                <div class="swap-wrap">
                  <button id="swap-exchanges" class="swap-button" type="button" aria-label="互换多空交易所">⇄</button>
                </div>
                <div class="field">
                  <label for="short_exchange">做空交易所</label>
                  <div class="side-config">
                    <select id="short_exchange" name="short_exchange"></select>
                    <select id="short_market_type" name="short_market_type" aria-label="做空市场类型"></select>
                  </div>
                </div>
              </div>
              <div class="field full">
                <label for="lookback_days">近几天</label>
                <input id="lookback_days" type="number" name="lookback_days" min="1" step="1" placeholder="例如 10">
              </div>
            </div>
            <div class="actions">
              <div class="hint">结束时间默认取当前时刻，支持一键互换多空交易所，默认两边都按合约口径计算。</div>
              <button id="run-button" type="submit">开始分析</button>
            </div>
          </form>

          <div id="error-box"></div>
        </section>
        </aside>

      <div id="results" class="results">
        <div class="overview-grid">
          <section class="panel summary-panel">
            <div class="section-head">
              <h2 id="result-title">分析结果</h2>
              <span id="result-meta"></span>
            </div>
            <div class="summary-grid">
              <div class="stat">
                <div class="stat-head">
                  <small id="summary-long-label"></small>
                  <span id="summary-long-tag" class="tag neutral">持平</span>
                </div>
                <strong id="summary-long-value"></strong>
              </div>
              <div class="stat">
                <div class="stat-head">
                  <small id="summary-short-label"></small>
                  <span id="summary-short-tag" class="tag neutral">持平</span>
                </div>
                <strong id="summary-short-value"></strong>
              </div>
              <div class="stat">
                <div class="stat-head">
                  <small id="summary-spread-label">选择区间累计利差 (S-L)</small>
                  <span id="summary-spread-tag" class="tag neutral">持平</span>
                </div>
                <strong id="summary-spread-value"></strong>
              </div>
            </div>
            <div class="summary-aux">
              <div class="summary-line">
                <div class="summary-line-copy">
                  <small>历史推算日化</small>
                  <span id="summary-daily-interest-meta"></span>
                </div>
                <strong id="summary-daily-interest-value"></strong>
              </div>
              <div id="recommendation-box"></div>
            </div>
            <div id="warning-box"></div>
          </section>

          <section class="panel snapshot-panel">
            <div class="section-head">
              <h2>当前周期快照</h2>
              <span>按当前周期归一到 8H / 天 / 年</span>
            </div>
            <div class="snapshot-metric-list">
              <div class="snapshot-metric-row">
                <small>8H 资费差 (S-L)</small>
                <strong id="snapshot-8h-spread-value"></strong>
              </div>
              <div class="snapshot-metric-row">
                <small>当前周期日化</small>
                <strong id="snapshot-daily-spread-value"></strong>
              </div>
              <div class="snapshot-metric-row">
                <small>当前周期年化</small>
                <strong id="snapshot-annual-spread-value"></strong>
              </div>
            </div>
            <div id="snapshot-side-list" class="snapshot-side-list"></div>
          </section>
        </div>

        <div class="tables-grid">
          <section class="panel">
            <div class="section-head">
              <h2>每日汇总统计</h2>
              <span>00:00 结算默认归到前一天</span>
            </div>
            <div style="overflow:auto;">
              <table>
                <thead>
                  <tr>
                    <th>统计日期</th>
                    <th id="daily-long-header"></th>
                    <th id="daily-short-header"></th>
                    <th>当日总利差 / 年化</th>
                  </tr>
                </thead>
                <tbody id="daily-table-body"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="section-head">
              <h2>详细结算明细</h2>
              <span>按任一边结算时点计算；另一边该时刻无结算则按 0 计入</span>
            </div>
            <div style="overflow:auto;">
              <table>
                <thead>
                  <tr>
                    <th>结算时间</th>
                    <th id="settlement-long-header"></th>
                    <th id="settlement-short-header"></th>
                    <th>利差 % (S-L)</th>
                  </tr>
                </thead>
                <tbody id="settlement-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
      </div>
    </div>

    <script>
      const EXCHANGE_OPTIONS = [
        { value: "binance", label: "bn" },
        { value: "bybit", label: "bybit" },
        { value: "bitget", label: "bitget" },
        { value: "okx", label: "okx" },
        { value: "gateio", label: "gateio" },
      ];
      const MARKET_TYPE_OPTIONS = [
        { value: "futures", label: "合约" },
        { value: "spot", label: "现货" },
      ];
      const BINANCE_FUTURES_BASES = [
        "https://fapi.binance.com",
        "https://fapi1.binance.com",
        "https://fapi2.binance.com",
        "https://fapi3.binance.com",
      ];
      const BYBIT_API_BASES = [
        "https://api.bybit.com",
        "https://api.bytick.com",
      ];

      const form = document.getElementById("analysis-form");
      const symbolInput = document.getElementById("symbol");
      const longExchangeSelect = document.getElementById("long_exchange");
      const shortExchangeSelect = document.getElementById("short_exchange");
      const longMarketTypeSelect = document.getElementById("long_market_type");
      const shortMarketTypeSelect = document.getElementById("short_market_type");
      const lookbackDaysInput = document.getElementById("lookback_days");
      const swapExchangesButton = document.getElementById("swap-exchanges");
      const runButton = document.getElementById("run-button");
      const resultsEl = document.getElementById("results");
      const errorBox = document.getElementById("error-box");
      const warningBox = document.getElementById("warning-box");
      const recommendationBox = document.getElementById("recommendation-box");
      const snapshotSideList = document.getElementById("snapshot-side-list");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function formatDateTimeDisplay(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function formatDateDisplay(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function normalizeSettlementTime(date) {
        const normalized = new Date(date.getTime());
        if (normalized.getSeconds() >= 59) {
          normalized.setMinutes(normalized.getMinutes() + 1);
        }
        normalized.setSeconds(0, 0);
        return normalized;
      }

      function toClassName(value) {
        if (value === null || value === undefined) return "muted";
        if (Math.abs(value) < 1e-8) return "neutral";
        return value > 0 ? "positive" : "negative";
      }

      function formatPercent(value) {
        if (value === null || value === undefined) return "-";
        return `${value.toFixed(4)}%`;
      }

      function getPositionFundingImpact(value, side) {
        if (value === null || value === undefined) return null;
        if (side === "long") return -value;
        if (side === "short") return value;
        return value;
      }

      function getFundingTag(value) {
        if (value === null || value === undefined || Math.abs(value) < 1e-8) {
          return { text: "持平", className: "neutral" };
        }
        if (value > 0) {
          return { text: "收资费", className: "positive" };

        if (value === null || value === undefined || Math.abs(value) < 1e-8) {
          return { text: "持平", className: "neutral" };

        if (value > 0) {
          return { text: "盈利", className: "positive" };

      function formatFetchErrorMessage(error) {
        const message = error?.message || String(error);
        if (message === "Failed to fetch") {
          return "Failed to fetch（可能是浏览器直连被目标站点拦截，或当前网络暂时无法连到该交易所）";
        }
        if (message === "request timeout") {
          return "请求超时（目标交易所响应过慢，已自动切换或跳过）";
        }
        return message;
      }

      function percentile(values, quantile) {
        if (!values || values.length === 0) return null;
        const sorted = [...values].sort((a, b) => a - b);
        if (sorted.length === 1) return sorted[0];
        const index = (sorted.length - 1) * quantile;
        const lower = Math.floor(index);
        const upper = Math.min(lower + 1, sorted.length - 1);
        const weight = index - lower;
        return sorted[lower] + (sorted[upper] - sorted[lower]) * weight;
      }

      async function fetchJson(url, params) {
        const fullUrl = `${url}?${new URLSearchParams(params).toString()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch(fullUrl, {
            method: "GET",
            headers: { "Accept": "application/json" },
            cache: "no-store",
            credentials: "omit",
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return await response.json();
        } catch (error) {
          if (error?.name === "AbortError") {
            throw new Error("request timeout");
          }
          throw error;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      async function fetchJsonFromBaseCandidates(baseUrls, path, params) {
        let lastError = null;
        for (const baseUrl of baseUrls) {
          try {
            return await fetchJson(`${baseUrl}${path}`, params);
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("request failed");
      }

      function inferCycleHours(timestamps) {
        const uniq = [...new Set(timestamps)].sort((a, b) => a - b);
        if (uniq.length < 2) return null;
        const intervals = [];
        for (let index = 1; index < uniq.length; index += 1) {
          const diff = uniq[index] - uniq[index - 1];
          if (diff > 0) intervals.push(diff / (60 * 60 * 1000));
        }
        if (intervals.length === 0) return null;
        intervals.sort((a, b) => a - b);
        return intervals[Math.floor(intervals.length / 2)];
      }

      function calcBasisPercent(markPrice, indexPrice) {
        if (
          markPrice === null || markPrice === undefined ||
          indexPrice === null || indexPrice === undefined ||
          indexPrice === 0
        ) {
          return null;
        }
        return ((markPrice - indexPrice) / indexPrice) * 100;
      }

      function buildCurrentSnapshot({
        exchange,
        marketType = "futures",
        currentRate = null,
        cycleHours = null,
        markPrice = null,
        indexPrice = null,
        nextFundingTime = null,
        timingLabel = "下次",
      }) {
        const normalized8hRate =
          currentRate !== null && cycleHours !== null && cycleHours !== 0
            ? currentRate * (8 / cycleHours)
            : null;
        const dailyizedRate =
          currentRate !== null && cycleHours !== null && cycleHours !== 0
            ? currentRate * (24 / cycleHours)
            : null;
        const annualizedRate = dailyizedRate !== null ? dailyizedRate * 365 : null;
        return {
          exchange,
          marketType,
          currentRate,
          cycleHours,
          normalized8hRate,
          dailyizedRate,
          annualizedRate,
          markPrice,
          indexPrice,
          basisPercent: calcBasisPercent(markPrice, indexPrice),
          nextFundingTime,
          timingLabel,
        };
      }

      function buildRecommendation(dailyRows, prediction) {
        const dailySpreads = dailyRows
          .map((row) => row.spread)
          .filter((value) => value !== null && Number.isFinite(value));

        if (dailySpreads.length < 3 || prediction.predictedDailySpread === null) {
          return {
            tone: "warn",
            title: "历史建议：先观望",
            message: "同结算点历史样本不足，暂时无法结合资费周期和历史分布给出可靠建议。",
          };
        }

        const medianDailySpread = percentile(dailySpreads, 0.5);
        const upperQuartileDailySpread = percentile(dailySpreads, 0.75);
        const positiveRatio = dailySpreads.filter((value) => value > 0).length / dailySpreads.length;
        const positiveRatioPct = Math.round(positiveRatio * 100);
        const predictedDailySpread = prediction.predictedDailySpread;

        if (predictedDailySpread <= 0) {
          return {
            tone: "error",
            title: "历史建议：暂不进入",
            message: `当前预测当日总利差为 ${formatPercent(predictedDailySpread)}，低于 0；历史正收益日占比约 ${positiveRatioPct}%。更适合先观望，等待资费重新转正后再评估。`,
          };
        }

        if (positiveRatio >= 0.6 && predictedDailySpread >= upperQuartileDailySpread) {
          return {
            tone: "good",
            title: "历史建议：可以考虑进入",
            message: `历史正收益日占比约 ${positiveRatioPct}%，当前预测当日总利差 ${formatPercent(predictedDailySpread)} 高于历史 75 分位 ${formatPercent(upperQuartileDailySpread)}。若手续费、滑点和资金占用成本可控，可考虑现在进入套取资费。`,
          };
        }

        if (positiveRatio >= 0.55 && predictedDailySpread >= medianDailySpread) {
          return {
            tone: "info",
            title: "历史建议：有条件参与",
            message: `历史正收益日占比约 ${positiveRatioPct}%，当前预测当日总利差 ${formatPercent(predictedDailySpread)} 高于历史中位 ${formatPercent(medianDailySpread)}，但还没有进入最强区间。更适合轻仓试探，或等待更好的资费窗口。`,
          };
        }

        return {
          tone: "warn",
          title: "历史建议：继续观察",
          message: `当前预测当日总利差 ${formatPercent(predictedDailySpread)} 未明显高于历史中位 ${formatPercent(medianDailySpread)}，历史正收益日占比约 ${positiveRatioPct}%。相比马上进入，更适合继续等待更好的价差和资费位置。`,
        };
      }

      async function analyzeFundingRates({ symbol, longExchange, shortExchange, longMarketType, shortMarketType, startDate, endDate }) {
        if (!symbol) throw new Error("币种不能为空");
        if (!exchangeFetchers[longExchange]) throw new Error(`不支持的做多交易所: ${longExchange}`);
        if (!exchangeFetchers[shortExchange]) throw new Error(`不支持的做空交易所: ${shortExchange}`);
        if (startDate >= endDate) throw new Error("开始时间必须早于结束时间");

        const warnings = [];
        const [longRaw, shortRaw] = await Promise.all([
          longMarketType === "spot" ? [] : exchangeFetchers[longExchange](symbol, startDate, endDate, warnings),
          shortMarketType === "spot" ? [] : exchangeFetchers[shortExchange](symbol, startDate, endDate, warnings),
        ]);
        const [longCurrentSnapshot, shortCurrentSnapshot] = await Promise.all([
          longMarketType === "spot" ? buildSpotSnapshot(longExchange) : currentSnapshotFetchers[longExchange](symbol, longRaw, warnings),
          shortMarketType === "spot" ? buildSpotSnapshot(shortExchange) : currentSnapshotFetchers[shortExchange](symbol, shortRaw, warnings),
        ]);

        const merged = new Map();
        for (const row of longRaw) {
          const key = row.time.getTime();
          if (!merged.has(key)) merged.set(key, { time: row.time, longRate: null, shortRate: null });
          merged.get(key).longRate = row.rate;
        }
        for (const row of shortRaw) {
          const key = row.time.getTime();
          if (!merged.has(key)) merged.set(key, { time: row.time, longRate: null, shortRate: null });
          merged.get(key).shortRate = row.rate;
        }

        const settlementRows = [];
        const dailyStats = new Map();
        const comparableTimes = [];
        const longAvailable = longMarketType === "spot" || longRaw.length > 0;
        const shortAvailable = shortMarketType === "spot" || shortRaw.length > 0;
        const canComputeUnionSpread = longAvailable && shortAvailable;
        let totalLong = 0;
        let totalShort = 0;

        const sortedRows = Array.from(merged.values()).sort((a, b) => a.time - b.time);
        for (const row of sortedRows) {
          const longRate = row.longRate;
          const shortRate = row.shortRate;
          const settlementLongRate = longRate !== null ? longRate : (canComputeUnionSpread ? 0 : null);
          const settlementShortRate = shortRate !== null ? shortRate : (canComputeUnionSpread ? 0 : null);
          const spread =
            settlementLongRate !== null && settlementShortRate !== null
              ? settlementShortRate - settlementLongRate
              : null;

          const statsDate = new Date(row.time);
          if (statsDate.getHours() === 0 && statsDate.getMinutes() === 0) {
            statsDate.setDate(statsDate.getDate() - 1);
          }
          const statsKey = formatDateDisplay(statsDate);
          if (!dailyStats.has(statsKey)) {
            dailyStats.set(statsKey, { longRate: 0, shortRate: 0 });
          }
          const currentDaily = dailyStats.get(statsKey);

          if (longRate !== null) {
            currentDaily.longRate += longRate;
            totalLong += longRate;
          }
          if (shortRate !== null) {
            currentDaily.shortRate += shortRate;
            totalShort += shortRate;
          }

          settlementRows.push({
            settlementTime: formatDateTimeDisplay(row.time),
            longRate: settlementLongRate,
            shortRate: settlementShortRate,
            spread,
          });

          if (spread !== null) {
            comparableTimes.push(row.time.getTime());
          }
        }

        let currentSpread = null;
        if (settlementRows.length > 0) {
          for (let index = settlementRows.length - 1; index >= 0; index -= 1) {
            if (settlementRows[index].spread !== null) {
              currentSpread = settlementRows[index].spread;
              break;
            }
          }
        }

        let settlementsPerDay = null;
        if (comparableTimes.length >= 2) {
          const intervals = [];
          for (let index = 1; index < comparableTimes.length; index += 1) {
            const interval = comparableTimes[index] - comparableTimes[index - 1];
            if (interval > 0) intervals.push(interval);
          }
          if (intervals.length > 0) {
            intervals.sort((a, b) => a - b);
            const medianInterval = intervals[Math.floor(intervals.length / 2)];
            settlementsPerDay = (24 * 60 * 60 * 1000) / medianInterval;
          }
        }

        const estimatedDailyInterest =
          currentSpread !== null && settlementsPerDay !== null
            ? currentSpread * settlementsPerDay
            : null;
        const predictedAnnualizedSpread =
          estimatedDailyInterest !== null ? estimatedDailyInterest * 365 : null;
        const cycleHours =
          settlementsPerDay !== null && settlementsPerDay > 0 ? 24 / settlementsPerDay : null;

        const dailyRows = Array.from(dailyStats.entries())
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([date, values]) => ({
            date,
            longRate: values.longRate,
            shortRate: values.shortRate,
            spread: values.shortRate - values.longRate,
          }));

        const prediction = {
          latestSpread: currentSpread,
          settlementsPerDay,
          cycleHours,
          predictedDailySpread: estimatedDailyInterest,
          predictedAnnualizedSpread,
        };
        const currentSnapshot = {
          long: longCurrentSnapshot,
          short: shortCurrentSnapshot,
          comparable8hSpread:
            longCurrentSnapshot.normalized8hRate !== null && shortCurrentSnapshot.normalized8hRate !== null
              ? shortCurrentSnapshot.normalized8hRate - longCurrentSnapshot.normalized8hRate
              : null,
        };
        currentSnapshot.comparableDailySpread =
          currentSnapshot.comparable8hSpread !== null ? currentSnapshot.comparable8hSpread * 3 : null;
        currentSnapshot.comparableAnnualizedSpread =
          currentSnapshot.comparableDailySpread !== null ? currentSnapshot.comparableDailySpread * 365 : null;

        return {
          symbol,
          longExchange,
          shortExchange,
          longMarketType,
          shortMarketType,
          startTime: formatDateTimeDisplay(startDate),
          endTime: formatDateTimeDisplay(endDate),
          settlementRows,
          dailyRows,
          prediction,
          currentSnapshot,
          recommendation: buildRecommendation(dailyRows, prediction),
          totals: {
            longRate: totalLong,
            shortRate: totalShort,
            spread: totalShort - totalLong,
          },
          warnings,
        };
      }

      function renderSummary(result) {
        const longLabel = formatExchangeWithMarket(result.longExchange, result.longMarketType);
        const shortLabel = formatExchangeWithMarket(result.shortExchange, result.shortMarketType);
        const longImpact = getPositionFundingImpact(result.totals.longRate, "long");
        const shortImpact = getPositionFundingImpact(result.totals.shortRate, "short");

        document.getElementById("result-title").textContent = `${result.symbol} 分析结果`;
        document.getElementById("result-meta").textContent = `${longLabel} 做多 / ${shortLabel} 做空 · ${result.startTime} 至 ${result.endTime}`;

        document.getElementById("summary-long-label").textContent = `${longLabel} 累计`;
        document.getElementById("summary-short-label").textContent = `${shortLabel} 累计`;
        document.getElementById("summary-spread-label").textContent = "选择区间累计利差 (S-L)";

        const longValue = document.getElementById("summary-long-value");
        const shortValue = document.getElementById("summary-short-value");
        const spreadValue = document.getElementById("summary-spread-value");
        const longTag = document.getElementById("summary-long-tag");
        const shortTag = document.getElementById("summary-short-tag");
        const spreadTag = document.getElementById("summary-spread-tag");
        const dailyInterestValue = document.getElementById("summary-daily-interest-value");
        const dailyInterestMeta = document.getElementById("summary-daily-interest-meta");
        const predictedDailySpread = result.prediction ? result.prediction.predictedDailySpread : null;
        const predictedAnnualizedSpread = result.prediction ? result.prediction.predictedAnnualizedSpread : null;

        longValue.textContent = formatPercent(longImpact);
        shortValue.textContent = formatPercent(shortImpact);
        spreadValue.textContent = formatPercent(result.totals.spread);
        dailyInterestValue.textContent =
          predictedDailySpread === null
            ? "-"
            : `${formatPercentPerDay(predictedDailySpread)} · ${formatPercentPerYear(predictedAnnualizedSpread)}`;

        longValue.className = toClassName(longImpact);
        shortValue.className = toClassName(shortImpact);
        spreadValue.className = toClassName(result.totals.spread);
        dailyInterestValue.className = toClassName(predictedDailySpread);

        const longTagInfo = getFundingTag(longImpact);
        const shortTagInfo = getFundingTag(shortImpact);
        const spreadTagInfo = getProfitTag(result.totals.spread);

        longTag.textContent = longTagInfo.text;
        shortTag.textContent = shortTagInfo.text;
        spreadTag.textContent = spreadTagInfo.text;
        longTag.className = `tag ${longTagInfo.className}`;
        shortTag.className = `tag ${shortTagInfo.className}`;
        spreadTag.className = `tag ${spreadTagInfo.className}`;

        dailyInterestMeta.textContent =
          result.prediction.latestSpread !== null && result.prediction.settlementsPerDay !== null && result.prediction.cycleHours !== null
            ? `最新一笔资费差 ${formatPercent(result.prediction.latestSpread)} · 约 ${formatRatio(result.prediction.settlementsPerDay)} · 约每 ${formatHours(result.prediction.cycleHours)} 结算一次`
            : "当前同结算点数据不足，暂时无法推算预测日化";
      }

      function renderRecommendation(result) {
        if (!result.recommendation) {
          recommendationBox.innerHTML = "";
          return;
        }

        recommendationBox.innerHTML = `
          <div class="alert ${result.recommendation.tone}">
            <div><strong>${result.recommendation.title}</strong></div>
            <div>${result.recommendation.message}</div>
          </div>
        `;
      }

      function renderCurrentSnapshot(result) {
        const snapshot8hValue = document.getElementById("snapshot-8h-spread-value");
        const snapshotDailyValue = document.getElementById("snapshot-daily-spread-value");
        const snapshotAnnualValue = document.getElementById("snapshot-annual-spread-value");

        snapshot8hValue.textContent = formatPercent(result.currentSnapshot.comparable8hSpread);
        snapshotDailyValue.textContent = formatPercentPerDay(result.currentSnapshot.comparableDailySpread);
        snapshotAnnualValue.textContent = formatPercentPerYear(result.currentSnapshot.comparableAnnualizedSpread);

        snapshot8hValue.className = toClassName(result.currentSnapshot.comparable8hSpread);
        snapshotDailyValue.className = toClassName(result.currentSnapshot.comparableDailySpread);
        snapshotAnnualValue.className = toClassName(result.currentSnapshot.comparableAnnualizedSpread);

        const rows = [
          { side: "多", impactSide: "long", data: result.currentSnapshot.long },
          { side: "空", impactSide: "short", data: result.currentSnapshot.short },
        ];
        snapshotSideList.innerHTML = rows.map(({ side, impactSide, data }) => {
          const currentImpact = getPositionFundingImpact(data.currentRate, impactSide);
          const normalizedImpact = getPositionFundingImpact(data.normalized8hRate, impactSide);
          const dailyImpact = getPositionFundingImpact(data.dailyizedRate, impactSide);
          const annualImpact = getPositionFundingImpact(data.annualizedRate, impactSide);
          return `
          <div class="snapshot-side-card ${side === "多" ? "long" : "short"}">
            <div class="snapshot-side-head">
              <span class="snapshot-side-badge ${side === "多" ? "long" : "short"}">${side}</span>
              <div class="snapshot-side-labels">
                <div class="snapshot-side-title">${side} · ${formatExchangeWithMarket(data.exchange, data.marketType || "futures")}</div>
                <div class="snapshot-side-meta">${data.marketType === "spot" ? "现货 · 无资金费" : `周期 ${formatCycle(data.cycleHours)} · ${data.timingLabel || "下次"} ${data.nextFundingTime || "-"}`}</div>
              </div>
            </div>
            <div class="snapshot-side-grid">
              <div class="snapshot-side-item">
                <small>当前持仓影响</small>
                <strong class="${toClassName(currentImpact)}">${formatPercent(currentImpact)}</strong>
              </div>
              <div class="snapshot-side-item">
                <small>8H 归一影响</small>
                <strong class="${toClassName(normalizedImpact)}">${formatPercent(normalizedImpact)}</strong>
              </div>
              <div class="snapshot-side-item">
                <small>日化影响</small>
                <strong class="${toClassName(dailyImpact)}">${formatPercentPerDay(dailyImpact)}</strong>
              </div>
              <div class="snapshot-side-item">
                <small>年化影响</small>
                <strong class="${toClassName(annualImpact)}">${formatPercentPerYear(annualImpact)}</strong>
              </div>
              <div class="snapshot-side-item">
                <small>标记 / 指数偏离</small>
                <strong class="${toClassName(data.basisPercent)}">${formatPercent(data.basisPercent)}</strong>
              </div>
            </div>
          </div>
        `;
        }).join("");
      }

      function renderDailyRows(result) {
        document.getElementById("daily-long-header").textContent = `${formatExchangeWithMarket(result.longExchange, result.longMarketType)} 累计`;
        document.getElementById("daily-short-header").textContent = `${formatExchangeWithMarket(result.shortExchange, result.shortMarketType)} 累计`;

        const body = document.getElementById("daily-table-body");
        body.innerHTML = [...result.dailyRows].reverse().map((row) => `
          <tr>
            <td>${row.date}</td>
            <td class="${toClassName(row.longRate)}">${formatPercent(row.longRate)}</td>
            <td class="${toClassName(row.shortRate)}">${formatPercent(row.shortRate)}</td>
            <td class="${toClassName(row.spread)}">
              <div class="table-metric-stack">
                <span>${formatPercent(row.spread)}</span>
                <small>${formatPercentPerYear(row.spread !== null && row.spread !== undefined ? row.spread * 365 : null)}</small>
              </div>
            </td>
          </tr>
        `).join("");
      }

      function renderSettlementRows(result) {
        document.getElementById("settlement-long-header").textContent = `${formatExchangeWithMarket(result.longExchange, result.longMarketType)} %`;
        document.getElementById("settlement-short-header").textContent = `${formatExchangeWithMarket(result.shortExchange, result.shortMarketType)} %`;

        const body = document.getElementById("settlement-table-body");
        body.innerHTML = [...result.settlementRows].reverse().map((row) => `
          <tr>
            <td>${row.settlementTime}</td>
            <td class="${toClassName(row.longRate)}">${formatPercent(row.longRate)}</td>
            <td class="${toClassName(row.shortRate)}">${formatPercent(row.shortRate)}</td>
            <td class="${toClassName(row.spread)}">${formatPercent(row.spread)}</td>
          </tr>
        `).join("");
      }

      function renderResult(result) {
        renderSummary(result);
        renderCurrentSnapshot(result);
        renderRecommendation(result);
        renderDailyRows(result);
        renderSettlementRows(result);
        setAlert(warningBox, "warn", result.warnings);
        resultsEl.classList.add("visible");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.innerHTML = "";
        warningBox.innerHTML = "";
        recommendationBox.innerHTML = "";
        resultsEl.classList.remove("visible");

        runButton.disabled = true;
        runButton.textContent = "分析中...";

        try {
          const lookbackDays = Number(lookbackDaysInput.value);
          if (!Number.isFinite(lookbackDays) || lookbackDays <= 0) {
            throw new Error("天数必须大于 0");
          }

          const endDate = new Date();
          endDate.setSeconds(0, 0);
          const startDate = new Date(endDate.getTime() - lookbackDays * 24 * 60 * 60 * 1000);

          const result = await analyzeFundingRates({
            symbol: symbolInput.value.trim().toUpperCase(),
            longExchange: longExchangeSelect.value,
            shortExchange: shortExchangeSelect.value,
            longMarketType: longMarketTypeSelect.value,
            shortMarketType: shortMarketTypeSelect.value,
            startDate,
            endDate,
          });
          renderResult(result);
        } catch (error) {
          setAlert(errorBox, "error", [error.message || String(error)]);
        } finally {
          runButton.disabled = false;
          runButton.textContent = "开始分析";
        }
      });

      fillExchangeOptions();
      setDefaultFormValues();
      swapExchangesButton.addEventListener("click", swapSelectedExchanges);
    </script>
  </body>
</html>
